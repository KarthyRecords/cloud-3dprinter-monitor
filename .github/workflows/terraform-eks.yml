name: terraform

# Pull request: terraform plan for every stack the PR changes (no approval needed).
# Merge to main: plan, then apply, in the same job, for every changed stack. The job waits for
# approval first (the "production" environment; add required reviewers in
# Settings -> Environments -> production), so read the plan on the pull request before merging.
# Manual run: plans the chosen stack (or all). It applies only if "apply" is ticked
# and the run is on main; the apply still waits for the same approval.
#
# Stacks are listed once, in apply order, in the detect job below.
on:
  pull_request:
    paths:
      - Network/**
      - eks-cluster-for-selfhosted-runner/**
      - iot-ingest/**
      - dashboard-ecs/**
      - .github/workflows/terraform-eks.yml
  push:
    branches: [main]
    paths:
      - Network/**
      - eks-cluster-for-selfhosted-runner/**
      - iot-ingest/**
      - dashboard-ecs/**
      - .github/workflows/terraform-eks.yml
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to run, or "all"
        type: choice
        default: all
        options:
          - all
          - Network
          - eks-cluster-for-selfhosted-runner
          - iot-ingest
          - dashboard-ecs
      apply:
        description: Also apply after planning (waits for approval). Leave off to plan only.
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_DEFAULT_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# one run at a time: two applies must never touch the same state
concurrency:
  group: terraform-eks
  cancel-in-progress: false

jobs:
  # Works out which stack folders changed and passes them on as a matrix.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
      apply: ${{ steps.pick.outputs.apply }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED: ${{ inputs.stack }}
          APPLY_INPUT: ${{ inputs.apply }}
          REF: ${{ github.ref }}
        run: |
          # apply order: network first, then the cluster, then what runs on top
          ALL='["Network","eks-cluster-for-selfhosted-runner","iot-ingest","dashboard-ecs"]'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" = "all" ]; then
              stacks="$ALL"
            else
              stacks=$(jq -nc --arg s "$REQUESTED" '[$s]')
            fi
          else
            if [ "$EVENT" = "pull_request" ]; then
              base="$BASE_SHA"
            else
              base="$BEFORE_SHA"
            fi
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              files=$(git ls-files)
            else
              files=$(git diff --name-only "$base" "$HEAD_SHA")
            fi
            echo "Changed files:"; echo "$files"

            stacks=$(echo "$files" | jq -R -s -c --argjson all "$ALL" '
              split("\n") as $f
              | $all | map(. as $s | select($f | any(startswith($s + "/"))))')

            # a pipeline edit alone plans every stack on a PR (to test it); a merge never applies for it
            if [ "$EVENT" = "pull_request" ] && echo "$files" | grep -qx ".github/workflows/terraform-eks.yml"; then
              stacks="$ALL"
            fi
          fi

          # apply only from main: on a merge, or on a manual run with the apply box ticked
          apply=false
          if [ "$REF" = "refs/heads/main" ] && [ "$stacks" != "[]" ]; then
            if [ "$EVENT" = "push" ]; then
              apply=true
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$APPLY_INPUT" = "true" ]; then
              apply=true
            fi
          fi

          echo "Stacks to run: $stacks"
          echo "Apply: $apply"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "apply=$apply" >> "$GITHUB_OUTPUT"

  # Fast, credential-free checks on a GitHub-hosted runner: formatting and validation.
  # A failure here fails the PR before anything is planned.
  validate:
    needs: detect
    if: needs.detect.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # shows the exact lines to change; fix them locally with `terraform fmt -recursive`
      - name: Format check
        run: terraform fmt -check -recursive -diff

      # no backend and no AWS credentials: only the syntax, types and references are checked
      - name: Init without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # Plan and apply for each stack in one job. Stacks run one at a time, in the order listed in the
  # detect job, so a later stack sees what the earlier one just created.
  terraform:
    needs: [detect, validate]
    if: needs.detect.outputs.stacks != '[]'
    runs-on: [self-hosted, infra-runner]
    timeout-minutes: 60
    # Only a run that will apply waits for approval. A plain plan uses the "plan" environment,
    # which has no reviewers (GitHub creates it on first use).
    environment: ${{ needs.detect.outputs.apply == 'true' && 'production' || 'plan' }}
    strategy:
      max-parallel: 1
      fail-fast: ${{ needs.detect.outputs.apply == 'true' }}
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # the helm and kubectl providers in the cluster stack call `aws eks get-token`
      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws sts get-caller-identity

      - run: terraform init
      - run: terraform plan -out=tfplan -lock-timeout=5m

      # applying the saved plan file needs no -auto-approve and cannot drift from what was just planned
      - name: Apply
        if: needs.detect.outputs.apply == 'true'
        run: terraform apply -lock-timeout=5m tfplan
